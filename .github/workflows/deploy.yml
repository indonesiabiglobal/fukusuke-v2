name: Deploy Fukusuke App to Production Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to production server 1
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.REMOTE_HOST_1 }}
          username: ${{ secrets.REMOTE_USER_1 }}
          key: ${{ secrets.SSH_PRIVATE_KEY_1 }}
          port: ${{ secrets.REMOTE_PORT_1 }}
          script: |
            set -euo pipefail
            cd /opt/fukusuke-v2

            git pull origin main

            php artisan optimize:clear

            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            npm ci
            npm run build

            # optimize = config:cache + route:cache. view:cache terpisah di Laravel 10.
            php artisan optimize
            php artisan view:cache

            sudo systemctl restart php8.2-fpm
